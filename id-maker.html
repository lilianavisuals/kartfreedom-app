<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>KartFreedom · Member IDs</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="_ds/kartfreedom-design-system-a6b48bc5-0155-44d3-95c9-dc16f47d2786/tokens/fonts.css">

<style>
*{box-sizing:border-box;margin:0;padding:0}
a{color:var(--kf-fluo)}a:hover{color:#fff}
.lbl-x{position:absolute;font:500 14px/1 "Montserrat",sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#6b6475}
.card{position:absolute;width:1012px;height:638px;border-radius:36px;overflow:hidden;color:#fff;font-family:"Montserrat",sans-serif;isolation:isolate;box-shadow:0 30px 60px rgba(20,4,30,.35),0 2px 6px rgba(20,4,30,.25);background:radial-gradient(70% 90% at 100% 0%,rgba(160,70,200,.55) 0%,rgba(160,70,200,0) 60%),radial-gradient(60% 70% at 0% 100%,rgba(112,47,142,.6) 0%,rgba(112,47,142,0) 65%),linear-gradient(150deg,#4A1666 0%,#2C0A3C 55%,#1C0628 100%)}
.card>*{position:absolute;z-index:2}
.card .guil{inset:0;z-index:0;opacity:.16;background:repeating-radial-gradient(circle at 78% 120%,transparent 0 13px,rgba(255,255,255,.5) 13px 14px),repeating-radial-gradient(circle at 105% -20%,transparent 0 17px,rgba(255,255,255,.35) 17px 18px);-webkit-mask-image:linear-gradient(110deg,transparent 30%,#000 75%);mask-image:linear-gradient(110deg,transparent 30%,#000 75%)}
.card .edge{inset:0;z-index:3;border-radius:36px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.28);pointer-events:none}
.card.kf-grain::after{opacity:.45;z-index:1}
.holo{background:linear-gradient(115deg,rgba(215,255,58,.0) 0%,rgba(215,255,58,.55) 18%,rgba(232,121,249,.6) 38%,rgba(120,200,255,.55) 58%,rgba(215,255,58,.5) 78%,rgba(215,255,58,0) 100%);mix-blend-mode:screen;opacity:.55}
.mono{font-family:"Geist Mono",ui-monospace,monospace;font-weight:400}
.f-hdr{left:56px;right:56px;top:48px;display:flex;align-items:center;gap:16px}
.f-hdr img{width:34px;height:34px;object-fit:contain}
.f-hdr .b{font-weight:600;font-size:17px;letter-spacing:.38em;text-transform:uppercase}
.f-hdr i{flex:1;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.5),rgba(255,255,255,.05))}
.f-hdr .t{font-weight:600;font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:var(--kf-fluo)}
.photo{left:56px;top:124px;width:230px;height:290px;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.22)}
.photo image-slot{width:100%;height:100%;color:rgba(255,255,255,.5)}
.name{left:318px;top:124px;right:56px;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.22)}
.k{display:block;font-weight:600;font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--kf-lilac-200);margin-bottom:8px}
.name .v{font-family:var(--kf-font-display);font-size:40px;line-height:1.02;text-transform:uppercase;white-space:nowrap}
.grid>div{min-width:0}.grid{left:318px;right:56px;top:230px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 24px}
.grid .v{font-size:21px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.grid .v.mono{font-size:20px;letter-spacing:.06em}
.grid .v.f{color:var(--kf-fluo)}
.ghostph{right:200px;top:410px;width:96px;height:120px;border-radius:8px;background:url('assets/jude-action.jpg') -154px -75px/400px auto no-repeat;filter:grayscale(1) contrast(1.1);opacity:.28;mix-blend-mode:screen;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.sig{left:56px;top:438px;width:400px}
.sig .line{height:52px;border-bottom:1px solid rgba(255,255,255,.4);position:relative}
.sign{position:absolute;left:6px;bottom:-10px;font-family:"Mrs Saint Delafield",cursive;font-size:62px;line-height:1;color:rgba(255,255,255,.92);transform:rotate(-4deg);transform-origin:left bottom;white-space:nowrap}
.sig .k{margin:10px 0 0}
.seal{right:56px;top:410px;width:120px;height:120px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.seal::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,rgba(215,255,58,.6),rgba(232,121,249,.6),rgba(120,200,255,.55),rgba(215,255,58,.6),rgba(232,121,249,.6),rgba(215,255,58,.6));mix-blend-mode:screen;opacity:.5}
.seal::after{content:"";position:absolute;inset:10px;border-radius:50%;border:1px dashed rgba(255,255,255,.4)}
.seal img{position:relative;width:46px;height:46px;object-fit:contain}
.ghost{left:430px;top:185px;width:640px;height:640px;opacity:.05;object-fit:contain;z-index:1!important}
.f-foot{left:56px;right:56px;bottom:40px;display:flex;align-items:center;justify-content:space-between}
.f-foot .mono{font-size:13px;letter-spacing:.24em;color:rgba(255,255,255,.7)}
.strip{left:0;right:0;bottom:84px;height:3px}
.b-strip{left:0;right:0;top:64px;height:96px;background:linear-gradient(180deg,#0E0414,#1A0726);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -1px 0 rgba(255,255,255,.08)}
.b-strip .holo{position:absolute;inset:0;opacity:.18}
.b-body{left:56px;right:56px;top:196px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:48px}
.b-body .k{margin-bottom:10px}
.b-row{display:flex;flex-direction:column;gap:22px}
.b-row .v{font-size:19px;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
.b-row p{font-size:15px;line-height:1.55;color:rgba(255,255,255,.82);text-wrap:pretty}
.b-sig{left:56px;width:520px;bottom:128px;padding-top:12px;border-top:1px solid rgba(255,255,255,.4)}
.b-ht{z-index:1!important;left:44px;top:292px;font-family:var(--kf-font-display);font-size:138px;line-height:1;text-transform:uppercase;white-space:nowrap;color:transparent;background:linear-gradient(90deg,rgba(138,70,172,.35) 0%,#9146B4 45%,rgba(138,70,172,.5) 100%),radial-gradient(circle,#A35BC6 44%,transparent 50%) 0 0/9px 9px;-webkit-background-clip:text;background-clip:text;-webkit-mask-image:linear-gradient(180deg,#000 45%,rgba(0,0,0,.35) 100%);mask-image:linear-gradient(180deg,#000 45%,rgba(0,0,0,.35) 100%);pointer-events:none}
.slog{left:56px;bottom:52px}.slog .k{margin-bottom:16px}
.sl{transform:skewX(-12deg);transform-origin:left bottom;font-family:"Horizon","Michroma",var(--kf-font-display);font-size:40px;line-height:1.12;letter-spacing:.01em;text-transform:uppercase;white-space:nowrap}
.sl em{font-style:normal;color:var(--kf-fluo)}
.speed{left:700px;right:0;bottom:56px;height:72px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end}
.speed i{display:block;height:3px;border-radius:2px 0 0 2px;background:linear-gradient(90deg,var(--kf-fluo) 0%,rgba(215,255,58,.85) 40%,rgba(215,255,58,.45) 100%);box-shadow:0 0 6px rgba(215,255,58,.35)}
.speed i.ref{height:2px;background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,.7) 40%,rgba(255,255,255,.3) 100%);box-shadow:none}
.b-tag{right:56px;bottom:158px;font-weight:600;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.b-foot{left:56px;right:56px;bottom:44px;display:flex;align-items:center;justify-content:space-between;padding-top:20px;border-top:1px solid rgba(255,255,255,.16)}
.b-foot span{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.b-foot b{font-weight:600;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--kf-fluo)}

html,body{background:#120419;color:#fff;font-family:"Montserrat",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:100vh}
.side{background:#1A0726;border-right:1px solid rgba(255,255,255,.1);padding:24px 20px;display:flex;flex-direction:column;gap:20px}
.side h1{font-family:var(--kf-font-display);font-size:18px;line-height:1.1;letter-spacing:0;text-transform:uppercase;overflow-wrap:anywhere}
.side h1 em{font-style:normal;color:var(--kf-fluo)}
.roster{display:flex;flex-direction:column;gap:6px}
.roster button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.84)}
.roster button:hover{background:rgba(255,255,255,.06)}
.roster button.on{background:rgba(215,255,58,.1);box-shadow:inset 0 0 0 1px rgba(215,255,58,.5);color:#fff}
.roster small{font-family:"Geist Mono",monospace;font-size:11px;color:var(--kf-lilac-200)}
.form{display:flex;flex-direction:column;gap:12px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.form label{display:flex;flex-direction:column;gap:6px;font-size:10px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--kf-lilac-200)}
.form input,.form select{font:500 14px "Montserrat",sans-serif;color:#fff;background:#0E0414;border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:9px 10px}
.form .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.form input,.form select{width:100%;min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;background:#0E0414;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}.seg button{all:unset;cursor:pointer;text-align:center;padding:8px 0;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.7)}.seg button:hover{background:rgba(255,255,255,.06)}.seg button.on{background:#fff;color:#18061F}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{all:unset;cursor:pointer;padding:10px 16px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.acc{background:var(--kf-fluo);color:#18061F;box-shadow:none}
.btn.acc:hover{background:#e6ff7a}
.btn.del{color:#ff9a9a;box-shadow:inset 0 0 0 1px rgba(255,120,120,.4)}
.hint{font-size:11px;line-height:1.5;color:rgba(255,255,255,.6)}
.main{padding:32px;display:flex;flex-direction:column;gap:28px;align-items:center}
.pair{display:flex;flex-wrap:wrap;gap:28px;justify-content:center}
.wrap{width:calc(1012px * var(--s));height:calc(638px * var(--s));position:relative}
.wrap .card{left:0;top:0;transform:scale(var(--s));transform-origin:0 0}
.cap{font:500 12px/1 "Montserrat";letter-spacing:.3em;text-transform:uppercase;color:#8d819b;margin-bottom:10px}
#print{display:none}
@media print{
@page{size:3.375in 2.125in;margin:0}
html,body{background:none}
.app{display:none}
#print{display:block}
#print .wrap{--s:.32016;page-break-after:always;break-after:page}
#print .card{box-shadow:none;border-radius:0}
#print .edge{border-radius:0}
}
</style></head>
<body>
<div class="app">
<aside class="side">
<h1>KartFreedom <em>IDs</em></h1>
<div class="seg" id="seg"><button data-k="driver">Drivers</button><button data-k="staff">Staff</button></div>
<div class="roster" id="roster"></div>
<div class="acts"><button class="btn" id="add">+ Add driver</button></div>
<div class="form" id="form">
<label>First name<input id="f-first"></label>
<label>Last name<input id="f-last"></label>
<div class="two"><label id="l-role">Role<select id="f-role"><option>Owner · Coach</option><option>Owner · Media</option><option>Manager</option><option>Coach</option><option>Mechanic</option><option>Coach · Mechanic</option><option>Team staff</option></select></label><label id="l-cls">Class<select id="f-cls"><option>Micro</option><option>Mini</option><optgroup label="X30"><option>X30 Junior</option><option>X30 Senior</option><option>X30 Masters</option></optgroup><optgroup label="KA100"><option>KA100 Junior</option><option>KA100 Senior</option><option>KA100 Masters</option></optgroup><optgroup label="LO206"><option>LO206 Junior</option><option>LO206 Senior</option><option>LO206 Masters</option></optgroup><option>Shifter</option></select></label><label><span id="l-no">Member no.</span><input id="f-no" class="mono"></label></div>
<label>Date of birth<input id="f-dob" type="date" style="color-scheme:dark"></label>
<div class="two"><label>Valid thru<input id="f-valid" placeholder="12.2027"></label><label>Since<input id="f-since" placeholder="2026"></label></div>
<p class="hint">Drop a photo into the card's photo box. Drag inside it to reposition.</p>
<div class="acts"><button class="btn del" id="del">Remove</button></div>
</div>
<div class="acts" style="margin-top:auto"><button class="btn acc" id="pr">Print / PDF all</button></div>
<p class="hint">Prints each card at CR80 size (3.375 × 2.125 in): front, then back, one per page.</p>
</aside>
<main class="main" id="main"></main>
</div>
<div id="print"></div>
<script>
const KEY='kf-member-ids-v1';
const seed=[{uid:'jude',first:'Jude',last:'Ellison',cls:'Micro',no:'KF-27-0001',valid:'12.2027',since:'2026',src:'assets/jude-id-photo.jpg'}];
let list;try{list=JSON.parse(localStorage.getItem(KEY))||seed}catch(e){list=seed}
list.forEach(m=>{m.kind=m.kind||'driver'});let kind='driver';let sel=list[0]?.uid;
const isS=m=>m.kind==='staff';const shown=()=>list.filter(m=>m.kind===kind);
const save=()=>localStorage.setItem(KEY,JSON.stringify(list));
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mrz=m=>('KF<<'+(m.last||'').toUpperCase().replace(/[^A-Z]/g,'<')+'<'+(m.first||'').toUpperCase().replace(/[^A-Z]/g,'<')+'<<'+(m.no||'').replace(/\D/g,'').slice(-4)+'<<USA');
const speed=code=>{const d=(code||'').replace(/\D/g,'').split('').map(Number);const c=d.reduce((a,b)=>a+b,0)%10;const bars=[100,...[...d,c].map(n=>30+7*n),100];return bars.map((w,i)=>'<i'+(i===0||i===bars.length-1?' class="ref"':'')+' style="width:'+w+'%"></i>').join('')};
const front=(m,slot)=>`<section class="card kf-grain" data-screen-label="ID Front · ${esc(m.first)} ${esc(m.last)}"><div class="guil"></div><img class="ghost" src="assets/kf-mark.png" alt=""><div class="f-hdr"><img src="assets/kf-mark.png" alt="KF"><span class="b">KartFreedom</span><i></i><span class="t">${isS(m)?'Team staff':'Driver membership'}</span></div><div class="photo">${slot?`<image-slot id="kfid-photo-${m.uid}" placeholder="${isS(m)?'Staff':'Driver'} photo" shape="rect"${m.src?` src="${m.src}"`:''}></image-slot>`:`<div class="pslot" data-uid="${m.uid}" style="width:100%;height:100%"></div>`}</div><div class="name"><span class="k">${isS(m)?'Staff':'Driver'}</span><div class="v" style="margin-top:6px">${esc(m.first)} ${esc(m.last)}</div></div><div class="grid"><div><span class="k">${isS(m)?'Staff no.':'Member no.'}</span><span class="v mono">${esc(m.no)}</span></div><div><span class="k">${isS(m)?'Role':'Class'}</span><span class="v">${esc(isS(m)?m.role:m.cls)}</span></div><div><span class="k">Valid thru</span><span class="v mono">${esc(m.valid)}</span></div><div><span class="k">${isS(m)?'Team since':'Member since'}</span><span class="v mono">${esc(m.since)}</span></div><div><span class="k">Date of birth</span><span class="v mono">${dob(m.dob)}</span></div></div><div class="seal"><img src="assets/kf-mark.png" alt=""></div><div class="strip holo"></div><div class="f-foot"><span class="mono">${esc(mrz(m))}</span><span class="mono">USA</span></div><div class="edge"></div></section>`;
const back=m=>`<section class="card kf-grain" data-screen-label="ID Back · ${esc(m.first)} ${esc(m.last)}"><div class="guil" style="transform:scaleX(-1)"></div><div class="b-strip"><div class="holo"></div></div><div class="b-body"><div class="b-row"><p>${isS(m)?'This card identifies the holder as KartFreedom team staff · '+esc(m.role)+'. Non-transferable.':'This card identifies the holder as a member of the KartFreedom driver development program. Non-transferable.'}</p></div><div class="b-row"><div><span class="k">${isS(m)?'Staff no.':'Member no.'}</span><span class="v mono" style="font-size:24px;letter-spacing:.06em">${esc(m.no)}</span></div><div><span class="k">Valid thru</span><span class="v mono" style="font-size:24px;letter-spacing:.06em">${esc(m.valid)}</span></div></div></div><div class="slog"><span class="k">Our motto</span><div class="sl">Racing is<br>in our <em>blood</em></div></div><div class="speed">${speed(m.no)}</div><div class="b-tag">@kartfreedom.us</div><div class="edge"></div></section>`;
const cur=()=>shown().find(m=>m.uid===sel);
const F=['first','last','cls','role','dob','no','valid','since'];const dob=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?m[2]+'.'+m[3]+'.'+m[1]:'—'};
function fitScale(){const w=document.getElementById('main').clientWidth-64;return Math.min(.62,Math.max(.28,w>1340?(w-28)/2024:w/1012))}
function fitText(root){root.querySelectorAll('.name .v,.grid .v').forEach(el=>{el.style.fontSize='';const max=el.parentElement.clientWidth;let fs=parseFloat(getComputedStyle(el).fontSize);while(el.scrollWidth>max&&fs>12){fs-=1;el.style.fontSize=fs+'px'}})}
function renderMain(){const m=cur();const main=document.getElementById('main');if(!m){main.innerHTML='<p class="hint">Add '+(kind==='staff'?'a staff member':'a driver')+' to start.</p>';return}const s=fitScale();main.innerHTML=`<div class="pair" style="--s:${s}"><div><div class="cap">Front</div><div class="wrap">${front(m,true)}</div></div><div><div class="cap">Back</div><div class="wrap">${back(m)}</div></div></div>`;fitText(main)}
function renderRoster(){document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.k===kind));document.getElementById('add').textContent=kind==='staff'?'+ Add staff':'+ Add driver';document.getElementById('l-role').style.display=kind==='staff'?'':'none';document.getElementById('l-cls').style.display=kind==='staff'?'none':'';document.getElementById('l-no').textContent=kind==='staff'?'Staff no.':'Member no.';document.getElementById('roster').innerHTML=shown().map(m=>`<button data-u="${m.uid}" class="${m.uid===sel?'on':''}"><span>${esc(m.first)} ${esc(m.last)}</span><small>${esc(m.no)}</small></button>`).join('');document.getElementById('form').style.display=cur()?'':'none';const m=cur();if(m)F.forEach(k=>{const el=document.getElementById('f-'+k);if(document.activeElement!==el)el.value=m[k]||''})}
function nextNo(){const yr=new Date().getFullYear()%100+1;const n=shown().reduce((a,m)=>Math.max(a,+((m.no||'').match(/(\d{4})$/)||[0,0])[1]),0)+1;return (kind==='staff'?'KF-ST-':'KF-'+yr+'-')+String(n).padStart(4,'0')}
document.getElementById('roster').onclick=e=>{const b=e.target.closest('button');if(!b)return;sel=b.dataset.u;renderRoster();renderMain()};
document.getElementById('add').onclick=()=>{const m={uid:'m'+Date.now().toString(36),kind,first:'New',last:kind==='staff'?'Staff':'Driver',cls:'Micro',role:'Coach',no:nextNo(),valid:'12.'+(new Date().getFullYear()+1),since:String(new Date().getFullYear())};list.push(m);sel=m.uid;save();renderRoster();renderMain();document.getElementById('f-first').select()};
document.getElementById('del').onclick=()=>{const m=cur();if(!m||!confirm('Remove '+m.first+' '+m.last+'?'))return;list=list.filter(x=>x!==m);sel=shown()[0]?.uid;save();renderRoster();renderMain()};
F.forEach(k=>document.getElementById('f-'+k).addEventListener('input',e=>{const m=cur();m[k]=e.target.value;save();renderRoster();renderMain()}));
document.getElementById('pr').onclick=()=>{const p=document.getElementById('print');p.innerHTML=list.map(m=>`<div class="wrap">${front(m,true)}</div><div class="wrap">${back(m)}</div>`).join('');p.style.display='block';fitText(p);p.style.display='';setTimeout(()=>print(),600)};
document.getElementById('seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;kind=b.dataset.k;sel=shown()[0]?.uid;renderRoster();renderMain()};
addEventListener('resize',renderMain);
renderRoster();renderMain();
</script>
</body></html>
