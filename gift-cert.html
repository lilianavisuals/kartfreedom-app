<html lang="en"><head><script>(function(){var bad=function(n){if(n.nodeType!==1||n.id==="root"||n.id==="pages")return false;var c=n.className;c=c&&c.baseVal!==undefined?c.baseVal:(c||"");return /netlify/i.test(n.tagName+" "+(n.id||"")+" "+c+" "+(n.src||"")+" "+(n.getAttribute("data-netlify")!=null?"netlify":""))};var sweep=function(){document.querySelectorAll("html > *:not(head):not(body), body > *").forEach(function(n){if(bad(n))n.remove()})};new MutationObserver(sweep).observe(document.documentElement,{childList:true,subtree:true});document.addEventListener("DOMContentLoaded",sweep)})();</script><style>@media print{body>*:not(#pages):not(#root):not(script):not(style){display:none!important}}</style><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gift certificate</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

.seal::before{content:"";position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(215,255,58,.6)}

.iss{left:410px;bottom:170px;width:520px}
.vr{left:1340px;top:150px;width:1px;height:600px;background:rgba(255,255,255,.2)}

.inc span{font:500 24px/1.2 var(--mt);letter-spacing:.14em;text-transform:uppercase}
.rd{font:400 21px/1.6 var(--mt);color:rgba(255,255,255,.86);text-wrap:pretty}.rd strong{font-weight:600;color:#fff}
.tc{left:410px;right:110px;bottom:90px;display:flex;justify-content:space-between;align-items:center;font:400 15px/1.5 var(--mt);letter-spacing:.06em;color:rgba(255,255,255,.62)}

.iv .fr{border-color:rgba(24,6,31,.22)}

.iv .k,.iv .fspec{color:var(--vio)}
.iv .seal{right:450px;bottom:130px;border-color:rgba(255,255,255,.5);color:#fff}
.iv .tf div,.iv .fld div,.iv .ofs div{border-color:rgba(24,6,31,.3)}
.iv .vr{background:rgba(24,6,31,.18)}
.iv .inc div{border-color:rgba(24,6,31,.16)}
.iv .tc{color:rgba(24,6,31,.6)}
.iv .perf{border-color:rgba(24,6,31,.35)}
.iv .stub{background:rgba(24,6,31,.035)}.iv .stub .lb{color:rgba(24,6,31,.7)}
.iv .spec{border-color:rgba(24,6,31,.2)}
</style></head><body>
<div class="bar"><div><b id="no"></b> <span id="sub"></span></div><div style="display:flex;gap:10px"><button id="pngbtn" onclick="savePNG()" style="background:transparent;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)">Save PNG</button><button onclick="print()">Save as PDF</button></div></div>
<div id="pages"></div>
<script>
const PK={"lo206-1":{eng:"LO206",st:"4-stroke",d:1},"lo206-2":{eng:"LO206",st:"4-stroke",d:2},"ka100-1":{eng:"KA100",st:"2-stroke",d:1},"ka100-2":{eng:"KA100",st:"2-stroke",d:2}};
const Q=new URLSearchParams(location.search),MODE=Q.has("png")?"png":Q.has("print")?"print":Q.has("embed")?"embed":"view";
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tks='<div class="grain"></div><div class="fr"></div><i class="tk a"></i><i class="tk b"></i><i class="tk c"></i><i class="tk d"></i><div class="hd"><img src="assets/kf-mark.png" alt=""><span>KartFreedom</span></div>';
function front(d,p,iv){const two=p.d>1;return `<section class="gc${iv?" iv":""}"><div class="gnd"></div><div class="ph"><img src="assets/gift-kart.jpg" alt="" style="object-position:50% 60%;transform:scale(${iv?1.3:1.25});transform-origin:52% 62%"></div>${tks}
<div class="ttl"><span class="eb">A gift for you</span><div class="h"${iv?' style="font-size:136px"':""}>Arrive<br><em>&amp; Drive</em></div><p class="ld"${iv?' style="max-width:720px"':""}>${two?"Two full training days on track.":"A full training day on track."} Race-ready kart, professional coach and trackside support.</p><span class="fspec">${p.eng} · ${p.st} · ${p.d} training day${two?"s":""}</span></div>
<div class="tf"><div style="width:400px"><span class="k">To</span><span class="hw">${esc(d.to)}</span></div><div style="width:540px"><span class="k">From</span><span class="hw">${esc(d.from)}</span></div></div>
<div class="seal"><span>${two?"Two<b>Days</b>On track":"Full<b>Day</b>On track"}</span></div><div class="perf"></div>
<div class="stub"><img src="assets/kf-mark.png" alt=""><div class="vt"><span class="v">${esc(d.no)}</span></div><span class="lb">Keep stub</span></div></section>`;}
function back(d,p,iv){const two=p.d>1;return `<section class="gc bk${iv?" iv":""}"><div class="gnd"></div>${tks}
<div class="bk-l"><span class="eb">The gift</span><div class="h2">${two?"Two days":"Your day"}<br><em>on track</em></div><div class="spec"><span>${p.eng} · ${p.st}</span><span>Arrive &amp; Drive · ${p.d} training day${two?"s":""}</span></div></div>
<div class="fld iss"><div><span class="k">Issued</span><span class="hw">${esc(d.issued)}</span></div></div><div class="vr"></div>
<div class="bk-r"><span class="eb">Included</span><div class="inc"><div><b>01</b><span>Race-ready ${p.eng} kart</span></div><div><b>02</b><span>Professional coaching</span></div><div><b>03</b><span>Fuel &amp; maintenance</span></div><div><b>04</b><span>Trackside support</span></div></div>
<p class="rd"><strong>To redeem</strong> · Book via kartfreedom.us and quote your certificate number. No kart or experience required.</p></div>
<div class="tc"><span>Non-refundable · Not exchangeable for cash · Subject to track availability</span><span class="v" style="font-size:16px">Nº ${esc(d.no)}</span></div>
<div class="perf" style="right:auto;left:300px"></div><div class="stub" style="right:auto;left:0;justify-content:center"></div></section>`;}
function fit(){document.querySelectorAll(".tf div,.fld div").forEach(row=>{const h=row.querySelector(".hw");if(!h)return;h.style.fontSize="";let s=parseFloat(getComputedStyle(h).fontSize);const room=()=>row.clientWidth-(row.querySelector(".k")?row.querySelector(".k").offsetWidth+30:0);while(h.offsetWidth>room()&&s>28){s-=2;h.style.fontSize=s+"px";}});
 if(MODE==="embed")document.body.style.setProperty("--fit",innerWidth/768);}
function kfRender(d){const p=PK[d.pkg]||PK["lo206-1"],iv=false;
 document.getElementById("pages").innerHTML=`<div class="page">${front(d,p,iv)}</div><div class="page">${back(d,p,iv)}</div>`;
 document.title=(d.no||"Gift certificate")+(d.to?" · "+d.to:"");document.getElementById("no").textContent=d.no||"";document.getElementById("sub").textContent=[d.to,p.eng+" · "+p.d+" day"+(p.d>1?"s":"")].filter(Boolean).join(" · ");
 document.fonts.ready.then(fit);}
window.kfRender=kfRender;
function fromHash(){try{return JSON.parse(decodeURIComponent(location.hash.slice(1)))}catch(e){return{no:"KF-GC-0000-000",pkg:"lo206-1",ed:"night",to:"",from:"",issued:""}}}
if(MODE==="embed")document.body.classList.add("embed");
kfRender(fromHash());addEventListener("hashchange",()=>kfRender(fromHash()));addEventListener("resize",fit);
if(MODE==="print"){Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>setTimeout(()=>print(),400));}

const toData=u=>fetch(u).then(r=>r.blob()).then(b=>new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result);f.readAsDataURL(b)}));let FONTCSS=null;
async function fontCSS(node){if(FONTCSS)return FONTCSS;let local='';try{local=await htmlToImage.getFontEmbedCSS(node)}catch(e){}
 let g='';try{for(const l of document.querySelectorAll('link[href*="fonts.googleapis"]')){let css=await (await fetch(l.href)).text();css=css.split('/* ').filter(b=>b.startsWith('latin */')).map(b=>'/* '+b).join('');const urls=[...new Set(css.match(/url\((https:[^)]+)\)/g)||[])].map(x=>x.slice(4,-1));for(const fu of urls){css=css.split(fu).join(await toData(fu))}g+=css}}catch(e){console.warn('font embed',e)}
 return FONTCSS=local+'\n'+g}
const dl=(u,n)=>{const a=document.createElement('a');a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove()};
async function kfPNG(){await document.fonts.ready;await Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})));const d=fromHash(),p=PK[d.pkg]||PK["lo206-1"],base='KartFreedom Gift Certificate - '+(d.no||'Blank '+p.eng+' '+p.d+' day'+(p.d>1?'s':''));const faces=[...document.querySelectorAll('#pages .gc')],w=faces[0].offsetWidth,h=faces[0].offsetHeight;const o={pixelRatio:1,width:w,height:h,style:{zoom:'1',margin:'0'},fontEmbedCSS:await fontCSS(faces[0])};await htmlToImage.toPng(faces[0],{...o,pixelRatio:.1});return [{url:await htmlToImage.toPng(faces[0],o),name:base+' - front.png'},{url:await htmlToImage.toPng(faces[1],o),name:base+' - back.png'}]}
window.kfPNG=kfPNG;
async function savePNG(){const b=document.getElementById('pngbtn');b.disabled=true;b.textContent='Preparing…';
 try{await document.fonts.ready;const d=fromHash(),p=PK[d.pkg]||PK["lo206-1"],base='KartFreedom Gift Certificate - '+(d.no||'Blank '+p.eng+' '+p.d+' day'+(p.d>1?'s':''));
  const faces=[...document.querySelectorAll('#pages .gc')],w=faces[0].offsetWidth,h=faces[0].offsetHeight;
  const o={pixelRatio:1,width:w,height:h,style:{zoom:'1',margin:'0'},fontEmbedCSS:await fontCSS(faces[0])};
  await htmlToImage.toPng(faces[0],{...o,pixelRatio:.1});
  dl(await htmlToImage.toPng(faces[0],o),base+' - front.png');await new Promise(r=>setTimeout(r,500));
  dl(await htmlToImage.toPng(faces[1],o),base+' - back.png');
 }catch(e){console.error(e);alert('PNG export failed: '+e.message)}b.disabled=false;b.textContent='Save PNG';}
if(MODE==="png"){Promise.all([document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))]).then(()=>setTimeout(savePNG,400));}
</script>
